# Render Blueprint: site estático servido da pasta site/ (deploy a cada push na main)
services:
  - type: web
    name: thayna-cabral-site
    runtime: static
    buildCommand: echo "site estatico, sem build"
    staticPublishPath: ./site
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    domains:
      - thaynacabraladvocacia.com.br
      - www.thaynacabraladvocacia.com.br
